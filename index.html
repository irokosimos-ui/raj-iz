html, body, #canvas {
	margin: 0;

	color: white;
	background-color: black;
	overflow: hidden;

}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>body{background:#040a16!important}#status{background:#040a16!important}#status-splash{object-fit:cover!important;object-position:50% 100%!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}#status-progress{width:44%!important;max-width:520px;height:6px!important;bottom:40px!important;left:0!important;right:0!important;margin:0 auto!important;transform:none!important;appearance:none;-webkit-appearance:none;border:0;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}#status-progress::-webkit-progress-bar{background:rgba(255,255,255,.18);border-radius:3px}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#3fd2a0,#5aa9ff);border-radius:3px}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#3fd2a0,#5aa9ff)}#status-notice{background:#0b1d33!important;border-color:#5aa9ff!important}@media (min-aspect-ratio:16/10){#status-splash{object-fit:cover!important}}@media (max-aspect-ratio:4/5){#status-splash{content:url(splash_portrait.jpg);object-fit:cover!important}}</style><script src="gpu_check.js"></script><script>(function(){var K='ld_pck',sz='';function run(){var st=document.getElementById('status'),pr=document.getElementById('status-progress');if(!st||!pr)return;try{sz=String(GODOT_CONFIG.fileSizes['index.pck'])}catch(e){}var seen=null;try{seen=localStorage.getItem(K)}catch(e){}if(sz&&seen===sz)return;var n=document.createElement('div');n.id='load-note';n.textContent='Первый запуск или обновление: загрузка может занять немного больше времени';n.style.cssText='position:absolute;left:0;right:0;z-index:3;text-align:center;font:13px/1.35 system-ui,Segoe UI,Arial,sans-serif;color:rgba(255,255,255,.5);pointer-events:none;padding:0 16px;visibility:hidden';st.appendChild(n);function place(){var r=pr.getBoundingClientRect();if(r.height>0){n.style.top=(r.bottom+10)+'px';n.style.visibility='visible'}}place();window.addEventListener('resize',place);var t=setInterval(function(){if(!document.body.contains(st)){clearInterval(t);if(sz)try{localStorage.setItem(K,sz)}catch(e){}return}place()},200)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})();</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":95592432,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
